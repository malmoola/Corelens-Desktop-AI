[package]
name = "corelens-desktop-ai"
version = "2.19.0"
description = "Corelens Desktop AI — local-first network diagram designer with live connectivity validation"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
corelens-formats = { path = "../crates/corelens-formats" }
corelens-probe = { path = "../crates/corelens-probe" }
corelens-discover = { path = "../crates/corelens-discover" }
corelens-meraki = { path = "../crates/corelens-meraki" }
corelens-catalog = { path = "../crates/corelens-catalog" }
corelens-collect = { path = "../crates/corelens-collect" }
corelens-topology = { path = "../crates/corelens-topology" }
corelens-path = { path = "../crates/corelens-path" }
corelens-mcp = { path = "../crates/corelens-mcp" }
corelens-diagnose = { path = "../crates/corelens-diagnose" }
# Every message from the page passes a sandboxed frame first.
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
svg2pdf = "0.13.0"
# The same version svg2pdf resolves, named directly to put several diagrams
# into one document.
pdf-writer = "0.12"
# Already resolved through zip; named directly to open a compressed draw.io
# page.
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
open = "5"
roxmltree = "0.20"
# The vault key in the OS keychain, when the operator asks for it —
# Credential Manager, the macOS Keychain, or the Secret Service over D-Bus.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
# The check for a newer release. 2.14.1 is the first on zip 9; older
# releases carry a zip whose extract can abort the process. Without its
# `rustls-tls` feature on purpose: that feature turns on rustls's *ring*
# provider, and the rest of the workspace uses aws-lc-rs — with both enabled
# rustls cannot pick a process-level provider and every TLS client in the
# app panics at first use. The plugin's HTTP client gets its TLS from the
# same reqwest the collectors use, named here so that does not depend on
# feature unification happening to hold.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["system-proxy", "zip"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# A provider's API key is read from the clipboard here, in Rust, and the
# clipboard cleared — so the key never passes through the page. Text only.
arboard = { version = "3", default-features = false }
pdf-extract = "0.12.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
# The fake device the AI tools are tested against.
russh = "0.65"
rand = "0.10"
# For the test that the app's TLS stack has exactly one crypto provider.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
# Arbitrary input for the IPC contract tests.
proptest = "1"
# Already resolved transitively through usvg (pdf.rs); pinned as a direct
# dependency so tests can check a converted SVG is well-formed XML, not just
# that it contains the right substrings. Was exactly this: a tag-count
# bug that a substring check would not have caught.
roxmltree = "0.20"
